<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETAILS // INDUSTRIAL QR TERMINAL</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- jsQR Library for QR decoding -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <style>
        .font-mono-custom {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        /* Details Studio aesthetic line accents */
        .details-border {
            border-color: rgba(255, 255, 255, 0.08);
        }
        .details-card {
            background: rgba(18, 18, 20, 0.85);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-[#09090b] text-zinc-100 font-sans antialiased min-h-screen flex flex-col justify-center items-center overflow-hidden selection:bg-zinc-800 selection:text-white">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="fixed inset-0 z-50 bg-[#09090b] flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-sm details-card border details-border rounded-xl p-8 shadow-2xl space-y-6">
            <div class="space-y-3">
                <div class="flex items-center justify-between">
                    <span class="text-[10px] font-mono-custom tracking-[0.2em] text-zinc-500 uppercase">STUDIO DETAILS</span>
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse"></span>
                </div>
                <h1 class="text-sm font-mono-custom tracking-wider text-zinc-200 uppercase font-medium">ブランドファーム認証ターミナル</h1>
            </div>

            <form id="login-form" class="space-y-4">
                <div class="space-y-1.5">
                    <label class="block text-[10px] font-mono-custom text-zinc-400 tracking-widest uppercase">オペレーターID</label>
                    <input type="text" id="login-id" required class="w-full bg-[#121214] border details-border rounded-lg px-3.5 py-3 text-xs text-zinc-100 font-mono-custom focus:outline-none focus:border-zinc-500 transition shadow-inner">
                </div>

                <div class="space-y-1.5">
                    <label class="block text-[10px] font-mono-custom text-zinc-400 tracking-widest uppercase">パスワード</label>
                    <input type="password" id="login-pass" required class="w-full bg-[#121214] border details-border rounded-lg px-3.5 py-3 text-xs text-zinc-100 font-mono-custom focus:outline-none focus:border-zinc-500 transition shadow-inner">
                </div>

                <div id="login-error" class="hidden text-[11px] font-mono-custom text-red-400 bg-red-950/20 border border-red-500/20 p-2.5 rounded text-center">
                    認証エラー: IDまたはパスワードを確認してください
                </div>

                <button type="submit" class="w-full py-3 bg-zinc-100 hover:bg-zinc-200 text-zinc-950 font-medium text-xs tracking-widest uppercase rounded-lg transition font-mono-custom shadow-sm mt-2">
                    システムにログイン
                </button>
            </form>
        </div>
        <footer class="mt-8 text-[10px] text-zinc-600 font-mono-custom tracking-[0.25em]">
            DETAILS // INDUSTRIAL FIRM MANAGEMENT
        </footer>
    </div>

    <!-- MAIN MENU SCREEN -->
    <div id="menu-screen" class="hidden fixed inset-0 z-40 bg-[#09090b] flex flex-col items-center justify-between p-6 overflow-y-auto">
        <header class="w-full max-w-md details-card border details-border rounded-xl p-4 shadow-lg flex items-center justify-between shrink-0">
            <div class="flex items-center space-x-2">
                <span class="text-[10px] font-mono-custom tracking-widest text-zinc-500">DETAILS</span>
                <span class="text-zinc-700">/</span>
                <h1 class="text-xs font-mono-custom tracking-wider text-zinc-300 uppercase">コントロールパネル</h1>
            </div>
            <div class="flex items-center space-x-2">
                <button id="logout-btn" class="px-2.5 py-1 bg-[#1b1b1f] hover:bg-red-950/40 text-zinc-400 hover:text-red-400 border details-border rounded text-[10px] font-mono-custom transition flex items-center space-x-1">
                    <span>ログアウト</span>
                </button>
                <div class="px-2.5 py-1 bg-[#121214] border details-border rounded text-[10px] font-mono-custom text-emerald-400 flex items-center space-x-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>ONLINE</span>
                </div>
            </div>
        </header>

        <main class="w-full max-w-md flex-1 flex flex-col justify-center space-y-3.5 my-auto">
            <button id="goto-scanner" class="w-full py-5 px-6 details-card hover:bg-[#161619] border details-border rounded-xl shadow-lg flex items-center justify-between transition group text-left">
                <div class="space-y-1">
                    <span class="text-xs font-mono-custom tracking-widest text-zinc-400 uppercase block">MODULE 01</span>
                    <span class="text-sm font-medium tracking-wide text-zinc-100 uppercase font-mono-custom block">QRコード読み取り</span>
                </div>
                <span class="text-zinc-500 group-hover:text-zinc-200 transition font-mono-custom text-lg">→</span>
            </button>

            <button id="goto-generator" class="w-full py-5 px-6 details-card hover:bg-[#161619] border details-border rounded-xl shadow-lg flex items-center justify-between transition group text-left">
                <div class="space-y-1">
                    <span class="text-xs font-mono-custom tracking-widest text-zinc-400 uppercase block">MODULE 02</span>
                    <span class="text-sm font-medium tracking-wide text-zinc-100 uppercase font-mono-custom block">QRコード作成</span>
                </div>
                <span class="text-zinc-500 group-hover:text-zinc-200 transition font-mono-custom text-lg">→</span>
            </button>
        </main>

        <!-- Credentials Change Section -->
        <footer class="w-full max-w-md details-card border details-border rounded-xl p-4 shrink-0 shadow-lg">
            <form id="change-cred-form" class="space-y-3">
                <div class="text-[10px] font-mono-custom text-zinc-400 uppercase tracking-widest">セキュリティ設定変更</div>
                <div class="flex space-x-2">
                    <input type="text" id="new-id-input" placeholder="新しいID" class="flex-1 bg-[#09090b] border details-border rounded px-3 py-2 text-xs text-zinc-200 font-mono-custom focus:outline-none focus:border-zinc-500 transition shadow-inner">
                    <input type="text" id="new-pass-input" placeholder="新しいパスワード" class="flex-1 bg-[#09090b] border details-border rounded px-3 py-2 text-xs text-zinc-200 font-mono-custom focus:outline-none focus:border-zinc-500 transition shadow-inner">
                </div>
                <button type="submit" class="w-full py-2 bg-[#1b1b1f] hover:bg-[#27272a] text-zinc-300 font-medium text-[11px] tracking-wider uppercase rounded transition font-mono-custom border details-border">
                    認証情報を更新
                </button>
            </form>
        </footer>
    </div>

    <!-- QR GENERATOR SCREEN -->
    <div id="generator-screen" class="hidden fixed inset-0 z-40 bg-[#09090b] flex flex-col items-center justify-between p-4 sm:p-6 overflow-y-auto">
        <header class="w-full max-w-md details-card border details-border rounded-xl p-4 shadow-lg flex items-center justify-between shrink-0">
            <div class="flex items-center space-x-3">
                <button id="back-from-gen" class="px-2.5 py-1.5 bg-[#121214] hover:bg-[#1c1c1f] text-zinc-300 rounded text-xs font-mono-custom transition flex items-center space-x-1 border details-border">
                    <span>← 戻る</span>
                </button>
                <h1 class="text-xs font-mono-custom tracking-wider text-zinc-300 uppercase">QR作成モジュール</h1>
            </div>
            <div class="px-2.5 py-1 bg-[#121214] border details-border rounded text-[10px] font-mono-custom text-zinc-400">
                GENERATOR
            </div>
        </header>

        <main class="w-full max-w-md flex-1 flex flex-col justify-start space-y-4 my-4">
            <div class="w-full details-card border details-border rounded-xl p-6 shadow-2xl space-y-4">
                <div class="grid grid-cols-3 gap-2">
                    <button id="generate-btn" class="col-span-1 py-3 bg-black hover:bg-zinc-900 text-zinc-100 font-medium text-xs tracking-wider uppercase rounded-lg shadow transition font-mono-custom border details-border">
                        作成
                    </button>
                    <button id="generate-random-btn" class="col-span-1 py-3 bg-[#1b1b1f] hover:bg-[#27272a] text-zinc-300 font-medium text-xs tracking-wider uppercase rounded-lg shadow transition font-mono-custom border details-border">
                        ランダム
                    </button>
                    <button id="clear-input-btn" class="col-span-1 py-3 bg-[#1b1b1f] hover:bg-red-950/40 text-zinc-400 hover:text-red-400 font-medium text-xs tracking-widest uppercase rounded-lg shadow transition font-mono-custom border details-border">
                        × 削除
                    </button>
                </div>

                <!-- Batch Quantity Selector -->
                <div class="space-y-1.5 pt-1 border-t details-border">
                    <div class="flex items-center justify-between">
                        <label class="text-[10px] font-mono-custom text-zinc-400 uppercase tracking-widest">一括作成個数 (1〜10個)</label>
                        <span id="batch-count-val" class="text-xs font-mono-custom text-zinc-200 font-bold">1個</span>
                    </div>
                    <select id="batch-count-select" class="w-full bg-[#09090b] border details-border rounded-lg px-3 py-2.5 text-xs text-zinc-200 font-mono-custom focus:outline-none focus:border-zinc-500 transition shadow-inner">
                        <option value="1">1個</option>
                        <option value="2">2個</option>
                        <option value="3">3個</option>
                        <option value="4">4個</option>
                        <option value="5">5個</option>
                        <option value="6">6個</option>
                        <option value="7">7個</option>
                        <option value="8">8個</option>
                        <option value="9">9個</option>
                        <option value="10">10個</option>
                    </select>
                </div>

                <!-- Dynamic Input Container based on batch count -->
                <div class="space-y-2">
                    <label class="block text-[10px] font-mono-custom text-zinc-400 uppercase tracking-widest">エンコード文字列 / URL</label>
                    <div id="dynamic-inputs-container" class="space-y-2 max-h-[200px] overflow-y-auto pr-1">
                        <!-- Dynamically populated input fields -->
                    </div>
                </div>
            </div>

            <div id="gen-result-container" class="hidden w-full details-card border details-border rounded-xl p-6 shadow-2xl flex flex-col items-center space-y-4">
                <div class="w-full flex items-center justify-between">
                    <div class="text-[10px] font-mono-custom text-zinc-400 uppercase tracking-widest">生成された高密度QRコード一覧</div>
                    <button id="download-all-btn" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 font-medium text-[10px] tracking-wider uppercase rounded shadow transition font-mono-custom border details-border flex items-center space-x-1">
                        <span>一括JPG保存</span>
                    </button>
                </div>
                <div id="qrcode-display" class="w-full max-h-[350px] overflow-y-auto space-y-4 pr-1"></div>
            </div>
        </main>

        <footer class="w-full max-w-md py-2 text-center shrink-0">
            <p class="text-[9px] text-zinc-600 font-mono-custom tracking-[0.2em]">STUDIO DETAILS // GENERATOR</p>
        </footer>
    </div>

    <!-- QR SCANNER SCREEN -->
    <div id="scanner-screen" class="hidden fixed inset-0 z-40 bg-[#09090b] flex flex-col items-center justify-between p-4 sm:p-6">
        <header class="w-full max-w-md details-card border details-border rounded-xl p-4 shadow-lg flex items-center justify-between shrink-0">
            <div class="flex items-center space-x-3">
                <button id="back-from-scan" class="px-2.5 py-1.5 bg-[#121214] hover:bg-[#1c1c1f] text-zinc-300 rounded text-xs font-mono-custom transition flex items-center space-x-1 border details-border">
                    <span>← 戻る</span>
                </button>
                <h1 class="text-xs font-mono-custom tracking-wider text-zinc-300 uppercase">外カメ・スキャナー</h1>
            </div>
            <div class="px-2.5 py-1 bg-[#121214] border details-border rounded text-[10px] font-mono-custom text-emerald-400 flex items-center space-x-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>ACTIVE</span>
            </div>
        </header>

        <!-- Scanner Viewport -->
        <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center my-2 relative overflow-hidden bg-black rounded-xl border details-border shadow-2xl">
            <!-- Video element (Forced rear camera via constraints) -->
            <video id="qr-video" class="absolute inset-0 w-full h-full object-cover" playsinline muted></video>
            <canvas id="qr-canvas" class="hidden"></canvas>

            <!-- Scanning Target Overlay Frame -->
            <div id="overlay-box" class="absolute inset-10 border border-dashed border-zinc-700 rounded-lg pointer-events-none transition-all duration-200"></div>

            <!-- Status Indicator at Bottom of Camera Frame -->
            <div class="absolute bottom-4 left-4 right-4 bg-[#09090b]/85 backdrop-blur-md border details-border rounded-lg p-3 text-center shadow-lg">
                <div id="scan-status" class="text-xs font-mono-custom text-zinc-300 tracking-wider">
                    [ 待機中: QRコードを枠内に合わせてください ]
                </div>
            </div>
        </main>

        <footer class="w-full max-w-md py-2 text-center shrink-0">
            <p class="text-[9px] text-zinc-600 font-mono-custom tracking-[0.2em]">STUDIO DETAILS // SCANNER</p>
        </footer>
    </div>

    <!-- Application Script -->
    <script>
        // Credentials storage
        let savedOperatorId = localStorage.getItem('op_id') || 'aBqMwCfZpJlVrThGcDkXnSqWmbfJPzLvRtHgCdKxNsQwMbFjP';
        let savedOperatorPass = localStorage.getItem('op_pass') || '7492830192847563021948372649581029384756201938472';

        // Valid QR codes database (defaults + dynamically generated)
        let validQrCodes = JSON.parse(localStorage.getItem('valid_qrs') || JSON.stringify(["https://qr.quel.jp/text.php"]));

        // DOM Elements
        const loginScreen = document.getElementById('login-screen');
        const loginForm = document.getElementById('login-form');
        const loginIdInput = document.getElementById('login-id');
        const loginPassInput = document.getElementById('login-pass');
        const loginError = document.getElementById('login-error');

        const menuScreen = document.getElementById('menu-screen');
        const logoutBtn = document.getElementById('logout-btn');
        const gotoScannerBtn = document.getElementById('goto-scanner');
        const gotoGeneratorBtn = document.getElementById('goto-generator');
        const changeCredForm = document.getElementById('change-cred-form');
        const newIdInput = document.getElementById('new-id-input');
        const newPassInput = document.getElementById('new-pass-input');

        const scannerScreen = document.getElementById('scanner-screen');
        const backFromScan = document.getElementById('back-from-scan');
        const video = document.getElementById('qr-video');
        const canvasElement = document.getElementById('qr-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const overlayBox = document.getElementById('overlay-box');
        const scanStatus = document.getElementById('scan-status');

        const generatorScreen = document.getElementById('generator-screen');
        const backFromGen = document.getElementById('back-from-gen');
        const dynamicInputsContainer = document.getElementById('dynamic-inputs-container');
        const generateBtn = document.getElementById('generate-btn');
        const generateRandomBtn = document.getElementById('generate-random-btn');
        const clearInputBtn = document.getElementById('clear-input-btn');
        const batchCountSelect = document.getElementById('batch-count-select');
        const batchCountVal = document.getElementById('batch-count-val');
        const genResultContainer = document.getElementById('gen-result-container');
        const qrcodeDisplay = document.getElementById('qrcode-display');

        let scanningActive = false;
        let streamInstance = null;
        let scanHistory = {}; // Tracks scan counts for each QR code
        let isCooldown = false;

        // Render dynamic input fields according to selected batch count
        function updateBatchInputs(preserveValues = []) {
            const count = parseInt(batchCountSelect.value) || 1;
            batchCountVal.textContent = count + "個";
            dynamicInputsContainer.innerHTML = "";

            for (let i = 0; i < count; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = "flex items-center space-x-2";

                const label = document.createElement('span');
                label.className = "text-[10px] font-mono-custom text-zinc-500 w-12 shrink-0";
                label.textContent = `#${i + 1}`;

                const input = document.createElement('input');
                input.type = "text";
                input.placeholder = `アイテム #${i + 1} の文字列またはURL`;
                input.className = "batch-text-input flex-1 bg-[#09090b] border details-border rounded-lg px-3 py-2 text-xs text-zinc-200 font-mono-custom focus:outline-none focus:border-zinc-500 transition shadow-inner";
                
                if (preserveValues[i]) {
                    input.value = preserveValues[i];
                }

                wrapper.appendChild(label);
                wrapper.appendChild(input);
                dynamicInputsContainer.appendChild(wrapper);
            }
        }

        batchCountSelect.addEventListener('change', () => {
            const currentInputs = document.querySelectorAll('.batch-text-input');
            const values = Array.from(currentInputs).map(input => input.value);
            updateBatchInputs(values);
        });

        // Initialize with 1 input field on load
        updateBatchInputs();

        // Navigation between screens
        gotoScannerBtn.addEventListener('click', () => {
            menuScreen.classList.add('hidden');
            scannerScreen.classList.remove('hidden');
            startScanner();
        });

        gotoGeneratorBtn.addEventListener('click', () => {
            menuScreen.classList.add('hidden');
            generatorScreen.classList.remove('hidden');
        });

        logoutBtn.addEventListener('click', () => {
            menuScreen.classList.add('hidden');
            loginScreen.classList.remove('hidden');
            loginForm.reset();
            loginError.classList.add('hidden');
        });

        backFromScan.addEventListener('click', () => {
            stopScanner();
            scannerScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
        });

        backFromGen.addEventListener('click', () => {
            generatorScreen.classList.add('hidden');
            menuScreen.classList.remove('hidden');
        });

        // Login Logic
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const id = loginIdInput.value.trim();
            const pass = loginPassInput.value.trim();

            if (id === savedOperatorId && pass === savedOperatorPass) {
                loginScreen.classList.add('hidden');
                menuScreen.classList.remove('hidden');
                loginError.classList.add('hidden');
                loginForm.reset();
            } else {
                loginError.classList.remove('hidden');
            }
        });

        // Change ID/Pass
        changeCredForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newId = newIdInput.value.trim();
            const newPass = newPassInput.value.trim();

            if (newId && newPass) {
                savedOperatorId = newId;
                savedOperatorPass = newPass;
                localStorage.setItem('op_id', savedOperatorId);
                localStorage.setItem('op_pass', savedOperatorPass);
                alert("認証情報が正常に更新されました。");
                changeCredForm.reset();
            } else {
                alert("新しいIDとパスワードを入力してください。");
            }
        });

        // Helper function to process QR creation (Batch support with high density / error correction 'H')
        function processQrGeneration() {
            const inputElements = document.querySelectorAll('.batch-text-input');
            const texts = Array.from(inputElements).map(el => el.value.trim());

            if (texts.some(t => t === "")) {
                alert("すべての項目にテキストまたはURLを入力してください。");
                return;
            }

            qrcodeDisplay.innerHTML = "";

            texts.forEach((text, i) => {
                if (!validQrCodes.includes(text)) {
                    validQrCodes.push(text);
                    localStorage.setItem('valid_qrs', JSON.stringify(validQrCodes));
                }

                const itemWrapper = document.createElement('div');
                itemWrapper.className = "flex flex-col sm:flex-row items-center justify-between bg-[#09090b] border details-border rounded-lg p-4 space-y-3 sm:space-y-0 sm:space-x-4";

                const qrSize = 140;
                // High density complex QR config using ecc=H and data API
                const qrImg = document.createElement('img');
                qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=${qrSize}x${qrSize}&ecc=H&data=` + encodeURIComponent(text);
                qrImg.alt = "Generated QR Code " + (i + 1);
                qrImg.className = "rounded-sm bg-white p-2 shrink-0 border border-zinc-700";
                qrImg.crossOrigin = "anonymous";

                const infoDiv = document.createElement('div');
                infoDiv.className = "flex-1 min-w-0 text-center sm:text-left space-y-1";
                infoDiv.innerHTML = `
                    <div class="text-[10px] font-mono-custom text-zinc-500 uppercase">ITEM #${i + 1}</div>
                    <div class="text-xs font-mono-custom text-zinc-200 truncate">${escapeHtml(text)}</div>
                `;

                const dlBtn = document.createElement('button');
                dlBtn.className = "px-4 py-2 bg-zinc-800 hover:bg-zinc-700 text-zinc-100 font-medium text-[11px] tracking-wider uppercase rounded-lg shadow transition font-mono-custom border details-border shrink-0";
                dlBtn.textContent = "JPG保存";
                dlBtn.onclick = () => downloadSingleQr(text);

                itemWrapper.appendChild(qrImg);
                itemWrapper.appendChild(infoDiv);
                itemWrapper.appendChild(dlBtn);
                qrcodeDisplay.appendChild(itemWrapper);
            });

            genResultContainer.classList.remove('hidden');
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // QR Generator Logic (Standard Button)
        generateBtn.addEventListener('click', () => {
            processQrGeneration();
        });

        // QR Generator Logic (Random 50 digits Numeric for all batch fields)
        generateRandomBtn.addEventListener('click', () => {
            const inputElements = document.querySelectorAll('.batch-text-input');
            inputElements.forEach(input => {
                let randomNumStr = "";
                for (let i = 0; i < 50; i++) {
                    randomNumStr += Math.floor(Math.random() * 10);
                }
                input.value = randomNumStr;
            });
            processQrGeneration();
        });

        // Clear Input Text Button
        clearInputBtn.addEventListener('click', () => {
            const inputElements = document.querySelectorAll('.batch-text-input');
            inputElements.forEach(input => {
                input.value = "";
            });
            genResultContainer.classList.add('hidden');
        });

        // Download Single QR as JPG
        function downloadSingleQr(targetText, callback) {
            const qrSize = 350;
            const apiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=${qrSize}x${qrSize}&ecc=H&data=` + encodeURIComponent(targetText);

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.src = apiUrl;
            img.onload = function() {
                const canvas = document.createElement('canvas');
                canvas.width = qrSize + 50;
                canvas.height = qrSize + 50;
                const ctx = canvas.getContext('2d');
                
                ctx.fillStyle = "#FFFFFF";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.drawImage(img, 25, 25, qrSize, qrSize);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.95);
                const link = document.createElement('a');
                link.download = 'details_qrcode_' + Date.now() + '_' + Math.floor(Math.random()*1000) + '.jpg';
                link.href = dataUrl;
                link.click();
                if (callback) callback();
            };
        }

        // Bulk Download All QR Codes sequentially
        document.getElementById('download-all-btn').addEventListener('click', () => {
            const inputElements = document.querySelectorAll('.batch-text-input');
            const texts = Array.from(inputElements).map(el => el.value.trim()).filter(t => t !== "");
            
            if (texts.length === 0) return;

            texts.forEach((text, index) => {
                setTimeout(() => {
                    downloadSingleQr(text);
                }, index * 400); // Staggered downloads to ensure all ITEM #1, #2, #3 files download successfully
            });
        });

        // Camera & Scanner Logic (Forcing Rear Camera)
        function startScanner() {
            scanningActive = true;
            isCooldown = false;
            
            navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: { exact: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            }).catch(() => {
                return navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "environment" } 
                });
            }).then((stream) => {
                streamInstance = stream;
                video.srcObject = stream;
                video.setAttribute("playsinline", true);
                video.play();
                requestAnimationFrame(tickScanner);
            }).catch((err) => {
                console.error("Camera error:", err);
                scanStatus.innerHTML = `<span class="text-red-400 font-bold">[ カメラ起動エラー: 外カメラにアクセスできません ]</span>`;
            });
        }

        function stopScanner() {
            scanningActive = false;
            if (streamInstance) {
                streamInstance.getTracks().forEach(track => track.stop());
                streamInstance = null;
            }
        }

        function tickScanner() {
            if (!scanningActive) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasElement.width = video.videoWidth;
                canvasElement.height = video.videoHeight;
                canvasCtx.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);
                const imageData = canvasCtx.getImageData(0, 0, canvasElement.width, canvasElement.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: "dontInvert",
                });

                if (code && !isCooldown) {
                    handleScannedCode(code.data);
                }
            }
            requestAnimationFrame(tickScanner);
        }

        function handleScannedCode(data) {
            isCooldown = true;
            const isTarget = validQrCodes.includes(data);

            // Check custom prefix rules (s = スペース, i = インディ, B = 美野)
            let prefixLabel = "";
            let isValidCustom = false;
            let maxAllowedScans = 1; // Default max scans for target/other valid codes is 1

            if (data.startsWith("s")) {
                prefixLabel = "スペース";
                isValidCustom = true;
            } else if (data.startsWith("i")) {
                prefixLabel = "インディ";
                isValidCustom = true;
                maxAllowedScans = 2; // 'i' is valid up to 2 times
            } else if (data.startsWith("B")) {
                prefixLabel = "美野";
                isValidCustom = true;
            }

            if (isTarget || isValidCustom) {
                if (!scanHistory[data]) {
                    scanHistory[data] = 0;
                }
                scanHistory[data]++;

                if (scanHistory[data] <= maxAllowedScans) {
                    overlayBox.className = "absolute inset-10 border-2 border-emerald-500 rounded-lg transition-all duration-200 shadow-[0_0_35px_rgba(16,185,129,0.4)]";
                    const displayName = prefixLabel ? ` [ ${prefixLabel} ]` : "";
                    scanStatus.innerHTML = `<span class="text-emerald-400 font-medium">[ 認証成功${displayName} (${scanHistory[data]}回目スキャン) ]</span>`;
                } else {
                    overlayBox.className = "absolute inset-10 border-2 border-red-500 rounded-lg transition-all duration-200 shadow-[0_0_35px_rgba(239,68,68,0.4)]";
                    scanStatus.innerHTML = `<span class="text-red-400 font-medium">[ 使用済み ]</span>`;
                }
            } else {
                overlayBox.className = "absolute inset-10 border-2 border-red-500 rounded-lg transition-all duration-200 shadow-[0_0_35px_rgba(239,68,68,0.4)]";
                scanStatus.innerHTML = `<span class="text-red-400 font-medium">[ 対象外QR (エラー) ]</span>`;
            }

            setTimeout(() => {
                overlayBox.className = "absolute inset-10 border border-dashed border-zinc-700 rounded-lg pointer-events-none";
                scanStatus.innerHTML = `<span class="text-zinc-300">[ 待機中: QRコードを枠内に合わせてください ]</span>`;

                setTimeout(() => {
                    isCooldown = false;
                }, 2000);
            }, 2000);
        }
    </script>
